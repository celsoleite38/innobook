{% extends 'base.html' %}
{% block title %}Link enviado — Editora Orange{% endblock %}

{% block content %}
<section class="bg-cream" style="min-height:90vh; display:flex; align-items:center; padding:3rem 0;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4 text-center">

                <div style="width:64px; height:64px; background:#1a1a2e; border-radius:50%;
                            display:flex; align-items:center; justify-content:center;
                            margin:0 auto 1rem;">
                    <i class="bi bi-envelope-check text-gold" style="font-size:28px;"></i>
                </div>
                <p style="font-family:'Playfair Display',serif; font-size:22px;
                           font-weight:600; color:#1a1a2e; margin-bottom:8px;">
                    Verifique seu e-mail
                </p>
                <p style="font-size:13px; color:#888; line-height:1.7; margin-bottom:1.5rem;">
                    Se existir uma conta com este e-mail, enviaremos um link para
                    redefinir sua senha. Confira também a caixa de spam.
                </p>
                <a href="{% url 'accounts:login' %}" class="btn-gold"
                   style="padding:11px 26px; font-size:12px;">
                    Voltar ao login
                </a>

            </div>
        </div>
    </div>
</section>
{% endblock %}
